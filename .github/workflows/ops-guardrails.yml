# Loop 2 guardrails on a schedule. Does NOTHING until you set the repository
# variable OPS_ENABLED = true (Settings > Secrets and variables > Actions > Variables).
# Required secrets: GOOGLE_ADS_YAML (full google-ads.yaml text), OPS_CONFIG_YAML (full config.yaml text).
# Optional secrets: TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
name: ops-guardrails

on:
  schedule:
    - cron: "17 * * * *"   # hourly stop-loss
    - cron: "43 2 * * *"   # daily negatives (02:43 UTC = 08:13 IST)
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ops-guardrails
  cancel-in-progress: false

jobs:
  guardrails:
    if: vars.OPS_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: automation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: automation/requirements.txt
      - run: pip install -r requirements.txt
      - name: Write credentials
        env:
          GOOGLE_ADS_YAML: ${{ secrets.GOOGLE_ADS_YAML }}
          OPS_CONFIG_YAML: ${{ secrets.OPS_CONFIG_YAML }}
        run: |
          printf '%s' "$GOOGLE_ADS_YAML" > google-ads.yaml
          printf '%s' "$OPS_CONFIG_YAML" > config.yaml
      - name: Stop-loss (pauses only, never raises budgets)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: python -m ops stoploss --apply
      - name: Negative keywords (daily run only)
        if: github.event.schedule == '43 2 * * *' || github.event_name == 'workflow_dispatch'
        run: python -m ops negatives --apply
      - name: Remove credentials
        if: always()
        run: rm -f google-ads.yaml config.yaml
